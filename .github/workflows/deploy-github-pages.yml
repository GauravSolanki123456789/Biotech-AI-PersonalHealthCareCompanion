# Builds the Next.js app as static HTML and publishes to GitHub Pages.
#
# Repo → Settings → Pages → Source: GitHub Actions.
#
# Backend (FastAPI) is not hosted on Pages. Set repository variable NEXT_PUBLIC_API_URL
# to your HTTPS API root (with CORS including this Pages origin).

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          # Must match the repository name exactly (GitHub Pages project URL path).
          NEXT_PUBLIC_BASE_PATH: Biotech-AI-PersonalHealthCareCompanion
          # Optional: Repository variable, e.g. https://your-api.onrender.com
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
